apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbackrest-config
data:
  pgbackrest.conf: |
    # pgBackRest Configuration for CloudNativePG

    [global]
    repo1-path=/var/lib/pgbackrest
    repo1-retention-full=90
    repo1-retention-full-type=day
    repo1-retention-diff=30
    repo1-retention-diff-type=day

    # Compression
    repo1-type=posix
    repo1-bundle=y
    repo1-block=y

    # WAL settings
    archive-timeout=300

    [timescale-db]
    pg1-path=/var/lib/postgresql/data/pgdata
